<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/test2/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="대한불교조계종 정족산 전등사">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jeondeungsa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jeondeungsa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* 브라우저 기본 스크롤바 숨김 */
    }

    body {
      background: #3d3a39;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Flutter 부팅 전까지 보이는 로딩 화면 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, #7f635b 0, #3d3a39 55%, #211c1b 100%);
      z-index: 0;
    }

    #app-loading-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      margin-bottom: 24px;
    }

    .loader-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(242, 242, 242, 0.16);
      border-top-color: #f2f2f2;
      animation: spin 1.1s linear infinite;
    }

    #app-loading-text {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

</head>
<body>
  <!-- Flutter Web이 초기화되기 전까지 보이는 로딩 화면 -->
  <div id="app-loading">
    <div id="app-loading-logo">
      <div class="loader-ring"></div>
    </div>
    <div id="app-loading-text">전등사로 들어가는 중...</div>
  </div>

  <!-- Flutter 부트스트랩 스크립트: 로딩 화면 위에 렌더링되며, 초기화 후 자연스럽게 덮어쓴다 -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
